services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      # INFO (not the ERROR default) so ACME issuance and renewal are visible in
      # `docker logs traefik`. At ERROR a successful renewal logs nothing, which
      # is indistinguishable from one that never ran.
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.${RESOLVER_NAME}.acme.dnschallenge=true"
      - "--certificatesresolvers.${RESOLVER_NAME}.acme.dnschallenge.provider=route53"
      # Force public resolvers for the propagation pre-check. Needed when the
      # host serves certificates for more than one DNS zone.
      - "--certificatesresolvers.${RESOLVER_NAME}.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.${RESOLVER_NAME}.acme.email=${CERT_EMAIL}"
      - "--certificatesresolvers.${RESOLVER_NAME}.acme.storage=/letsencrypt/acme.json"
    environment:
      # Route53 DNS-01 credentials (read by traefik's lego ACME client).
      - "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
      - "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
      - "AWS_REGION=${AWS_REGION}"
      # Do NOT set AWS_HOSTED_ZONE_ID. Leave it unset, and lego auto-detects the
      # correct public hosted zone for each FQDN. This is necessary when the host
      # serves certificates for more than one zone.
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.force-secure.redirectscheme.scheme=https"
      - "traefik.http.middlewares.force-secure.redirectscheme.permanent=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./acme.json:/letsencrypt/acme.json"
    networks:
      - proxy

networks:
  proxy:
    name: traefik_host_network
    external: true
